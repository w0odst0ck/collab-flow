# =============================================================================
# defaults.yaml —— collab-flow 全局默认配置(公开仓,零个人标识)
#
# 定位:flow-config 加载层的最低优先级配置源。每个值必须与 scripts/dsh-design
#       的历史默认一致(兼容性红线)。本文件绝不出现:人名、真实 home 用户名
#       (一律用 ~)、真实项目路径、明文 key。
#
# 合并优先级(P1 实现 user+defaults 两级;project/work-item 留待 P2+):
#   CLI flag > env(已设置) > user config(~/.config/collabflow/config.yaml) > 本文件
# =============================================================================

version: 1                     # 配置 schema 主版本;flow-config 拒绝未知主版本

roles:
  designer:                    # 设计师角色(P1 唯一角色;critic/executor/approver 见 P2+)
    adapter: dsh-designer      # 适配器名(对应架构 §2.1 RoleAdapter.id)
    model:
      pro: deepseek-v4-pro     # 强制 pro 模型(红线:方案必须 pro 产出)
      flash: deepseek-v4-flash # flash 模型(仅用于「禁止」校验,绝不主动选用)
      provider: deepseek-official  # 写入 pro.patch.yml 的 config.provider
    timeout_s: 1800            # dsh 运行超时(秒);pro 推理慢,需放宽
    permission: read-only      # 沙箱权限;红线:默认只读,仅 workspace-write 可选
    patch:
      path: ~/.config/dsh-design/pro.patch.yml  # pro 强制补丁路径(缺失时自愈生成)
    key:
      env_ref: ${DEEPSEEK_API_KEY}  # 红线:只允许环境变量引用,禁止明文;P1 仅支持此绑定
      source: ~/.reasonix/.env      # key 兜底来源(含 DEEPSEEK_API_KEY=... 的 dotenv)
    prices: null               # 价格表(元/百万 token);null=关闭金额估算(与现状一致)
                               # 启用示例(发布前以官方价目表校准):
                               #   prices:
                               #     input: 2.0
                               #     output: 8.0
                               #     cache_read: 0.5
                               #     reasoning: 2.0

paths:
  dsh_bin: dsh                 # dsh 可执行(DSH_BIN;可 "npx --yes dsh")
  dsh_home: ~/.dsh             # dsh 会话根(DSH_HOME;成本统计与模型回验用)
  stats_script: null           # null → dsh-design 用其旁的 dsh-design-stats.py

workitem:                      # P2 新增;全标量,保证 P1 解析器照常通过(§7.1)
  schema_version: 1
  lock_ttl_s: 3600             # 单写者锁默认 TTL(秒);env FLOW_LOCK_TTL_S 可覆盖
  plane_id: control            # 锁 owner/事件 actor 默认值(零个人标识,不取 hostname)
  id_max_len: 64               # work-item id 最大长度
  design_expected_seconds: 480 # design --async 的 SLA 预估(软截止,非硬超时);env FLOW_DESIGN_EXPECTED_S 可覆盖
gates:
  quality: true                # 质量门(decision.yaml.verdict)恒开
  test: true                   # 测试门(executor/verify.json 三条件)恒开
  takeover_after_same_defect: 2  # 同类缺陷达到该阈值 → takeover(接管)
  iteration_limit: 3           # 打回迭代上限(预留)
executor:                      # P3 新增;全标量(执行器默认策略)
  default: reasonix            # 默认执行器(flow workitem execute 未指定 --executor 时)
  timeout_s: 1800              # 默认超时兜底(实际以 spec.invoke.timeout_s 为主,--timeout 可覆盖)
  diff_scope: null             # 默认不设全局 scope;scope 来自 taskbook 前置块或 --scope,缺失即 fail-closed
task:                          # M1 新增;全标量,P1 解析器照常通过(task 核心模块读取)
  schema_version: 1
  max_parallel: 2              # 全局并发上限(running 任务数);run --max-parallel 可覆盖,env FLOW_TASK_MAX_PARALLEL
  default_priority: P2         # 新任务默认优先级
  log_tail_bytes: 2000         # failure_tail 抽取字节数(对齐 executor output_tail 口径),env FLOW_TASK_LOG_TAIL_BYTES
  kill_grace_s: 5              # --kill-on-timeout 时 SIGTERM→SIGKILL 宽限秒数
  expected_seconds_seed:       # M2 新增:队列 SLA 硬超时种子(软截止先验,非硬超时本身)
    design: 480                # 对齐 workitem.design_expected_seconds
    execute: 1800              # 对齐 executor.timeout_s
  seed_history_len: 8          # M2 新增:每 kind 保留的 duration 样本数
  prune_done_days: 3           # 写时自动清理:done 保留天数(§5.1),env FLOW_TASK_PRUNE_DONE_DAYS
  prune_failed_days: 7         # 写时自动清理:failed/timeout/killed 保留天数(§5.1),env FLOW_TASK_PRUNE_FAILED_DAYS
  task_cap: 100                # 注册表容量上限:超限删最老终态(§5.1),env FLOW_TASK_TASK_CAP
  stale_after_s: 300           # 僵尸任务判定:running 心跳静默秒数(§5.2),env FLOW_TASK_STALE_AFTER_S
host:                          # M2 新增:宿主集成钩子(全标量,均 null=关闭)
  notify: null                 # 通知命令模板;非空时终态把事件 JSON 走 stdin 喂给该命令
  wake_template: null          # 唤醒文本模板;null=内置默认;占位符渲染(design M2 §1.5)

