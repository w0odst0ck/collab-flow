# =============================================================================
# defaults.yaml —— collab-flow 全局默认配置(公开仓,零个人标识)
#
# 定位:flow-config 加载层的最低优先级配置源。每个值必须与 scripts/dsh-design
#       的历史默认一致(兼容性红线)。本文件绝不出现:人名、真实 home 用户名
#       (一律用 ~)、真实项目路径、明文 key。
#
# 合并优先级(P1 实现 user+defaults 两级;project/work-item 留待 P2+):
#   CLI flag > env(已设置) > user config(~/.config/collabflow/config.yaml) > 本文件
# =============================================================================

version: 1                     # 配置 schema 主版本;flow-config 拒绝未知主版本

roles:
  designer:                    # 设计师角色(P1 唯一角色;critic/executor/approver 见 P2+)
    adapter: dsh-designer      # 适配器名(对应架构 §2.1 RoleAdapter.id)
    model:
      pro: deepseek-v4-pro     # 强制 pro 模型(红线:方案必须 pro 产出)
      flash: deepseek-v4-flash # flash 模型(仅用于「禁止」校验,绝不主动选用)
      provider: deepseek-official  # 写入 pro.patch.yml 的 config.provider
    timeout_s: 1800            # dsh 运行超时(秒);pro 推理慢,需放宽
    permission: read-only      # 沙箱权限;红线:默认只读,仅 workspace-write 可选
    patch:
      path: ~/.config/dsh-design/pro.patch.yml  # pro 强制补丁路径(缺失时自愈生成)
    key:
      env_ref: ${DEEPSEEK_API_KEY}  # 红线:只允许环境变量引用,禁止明文;P1 仅支持此绑定
      source: ~/.reasonix/.env      # key 兜底来源(含 DEEPSEEK_API_KEY=... 的 dotenv)
    prices: null               # 价格表(元/百万 token);null=关闭金额估算(与现状一致)
                               # 启用示例(发布前以官方价目表校准):
                               #   prices:
                               #     input: 2.0
                               #     output: 8.0
                               #     cache_read: 0.5
                               #     reasoning: 2.0

paths:
  dsh_bin: dsh                 # dsh 可执行(DSH_BIN;可 "npx --yes dsh")
  dsh_home: ~/.dsh             # dsh 会话根(DSH_HOME;成本统计与模型回验用)
  stats_script: null           # null → dsh-design 用其旁的 dsh-design-stats.py

workitem:                      # P2 新增;全标量,保证 P1 解析器照常通过(§7.1)
  schema_version: 1
  lock_ttl_s: 3600             # 单写者锁默认 TTL(秒);env FLOW_LOCK_TTL_S 可覆盖
  plane_id: control            # 锁 owner/事件 actor 默认值(零个人标识,不取 hostname)
  id_max_len: 64               # work-item id 最大长度
  design_expected_seconds: 480 # design --async 的 SLA 预估(软截止,非硬超时);env FLOW_DESIGN_EXPECTED_S 可覆盖
gates:
  quality: true                # 质量门(decision.yaml.verdict)恒开
  test: true                   # 测试门(executor/verify.json 三条件)恒开
  takeover_after_same_defect: 2  # 同类缺陷达到该阈值 → takeover(接管)
  iteration_limit: 3           # 打回迭代上限(预留)
executor:                      # P3 新增;全标量(执行器默认策略)
  default: reasonix            # 默认执行器(flow workitem execute 未指定 --executor 时)
  timeout_s: 1800              # 默认超时兜底(实际以 spec.invoke.timeout_s 为主,--timeout 可覆盖)
  local:                       # executor=local(本地模型批处理)专用默认;env 无覆盖,user config 可配
    timeout_s: 1200            # local 任务默认超时(秒);ollama 本地推理,1200s 足够批处理/小任务
  diff_scope: null             # 默认不设全局 scope;scope 来自 taskbook 前置块或 --scope,缺失即 fail-closed
  size:                        # W-S1:size→模型/超时映射(可配;段缺失/损坏回退 flow-core 硬编码 SIZE_DEFAULTS)
    small:                     # 小改:flash + 1200s(永不自动降档,仅显式声明)
      model: deepseek-v4-flash
      timeout_s: 1200
    medium:                    # 中改(默认档,与旧默认 1800 等价):flash + 1800s
      model: deepseek-v4-flash
      timeout_s: 1800
    large:                     # 大改:强制 pro + 2400s(显式降级需 --force --force-reason)
      model: deepseek-v4-pro
      timeout_s: 2400          # 同时是 --timeout 与 RX_TIMEOUT 单超时源(wrapper 内部 export RX_TIMEOUT=$TIMEOUT)
  size_estimate:               # W-S1:size 缺失时的估算阈值(可配,键缺失用硬编码兜底)
    design_bytes_large: 30720  # design.md 超过 30KB → large
    changed_files_large: 5     # 改动文件数超过 5 → large
task:                          # M1 新增;全标量,P1 解析器照常通过(task 核心模块读取)
  schema_version: 1
  max_parallel: 2              # 全局并发上限(running 任务数);run --max-parallel 可覆盖,env FLOW_TASK_MAX_PARALLEL
  default_priority: P2         # 新任务默认优先级
  log_tail_bytes: 2000         # failure_tail 抽取字节数(对齐 executor output_tail 口径),env FLOW_TASK_LOG_TAIL_BYTES
  kill_grace_s: 5              # --kill-on-timeout 时 SIGTERM→SIGKILL 宽限秒数
  expected_seconds_seed:       # M2 新增:队列 SLA 硬超时种子(软截止先验,非硬超时本身)
    design: 480                # 对齐 workitem.design_expected_seconds
    execute: 1800              # 对齐 executor.timeout_s
                               # (2026-08-22 收窄:仅 design/execute 入队,verify/review/batch 不再有 seed)
  seed_history_len: 8          # M2 新增:每 kind 保留的 duration 样本数
  queue_cap: 50                # 新增:非终态硬拒上限(入队拒绝),env FLOW_TASK_QUEUE_CAP
                               # 与 task_cap(100,写时删最老终态)语义分离:queue_cap=入队拒、task_cap=保留清理
  prune_done_days: 3           # 写时自动清理:done 保留天数(§5.1),env FLOW_TASK_PRUNE_DONE_DAYS
  prune_failed_days: 7         # 写时自动清理:failed/timeout/killed 保留天数(§5.1),env FLOW_TASK_PRUNE_FAILED_DAYS
  task_cap: 100                # 注册表容量上限:超限删最老终态(§5.1),env FLOW_TASK_TASK_CAP
  stale_after_s: 300           # 僵尸任务判定:running 心跳静默秒数(§5.2),env FLOW_TASK_STALE_AFTER_S
  # W-S2(executor-timeout-recovery §2.7 决策):rescue/token 阈值不新增 defaults 键,
  # 由 env FLOW_TASK_RESCUE_MAX_RETRIES / FLOW_TASK_TOKEN_WARN_THRESHOLD 或
  # user config task.rescue_max_retries / task.token_warn_threshold 覆盖;缺失时
  # flow-task-core 硬编码兜底(自动重跑限次 2 / reasonix token 峰值告警阈值 300000)。
  # ── cost-opt-cache-dispatch(省钱批次 1b) ─────────────────────────────
  # 同仓串行开关(默认 1=开):同 workdir 任务串行派发 → 后任务命中 prefix cache。
  #   env FLOW_TASK_SAME_WORKDIR_SERIAL=0 恢复现状(同仓照常并行)。
  # pro 全局串行开关(默认 1=开):design(pro)+large execute(pro) 同时最多 1 个。
  #   env FLOW_TASK_PRO_SERIAL=0 恢复现状(pro 可并行,成本峰值双倍)。
  # 两开关均不新增活动键:缺失时 flow-task-core 硬编码兜底 1(开)。
host:                          # M2 新增:宿主集成钩子(全标量,均 null=关闭)
  notify: null                 # 通知命令模板;非空时终态把事件 JSON 走 stdin 喂给该命令
  wake_template: null          # 唤醒文本模板;null=内置默认;占位符渲染(design M2 §1.5)
chain:                         # chain-on-transition 新增:post-transition 钩子链(全标量,P1 解析器照常通过)
  enabled: true                # 总开关;false = 完全退化(零钩子、零 audit、零新增文件)
  on_designed: auto_review      # auto_review:design 终态自动机械检查+LLM审→decision→translate→enqueue(全链自动)
  on_reviewed: true            # auto_translate:review 通过后渲染 taskbook 并链式转 translated
  on_translated: true          # auto_enqueue:判下一空闲窗口后 flow task add execute
  on_executed: true            # auto_verify:verify --auto 语义 → verified 或打回加重试环
  on_verified: true            # notify_accept:推送验收摘要(accept 永远人工)
  review_llm: false            # auto_review 是否追加 LLM 语义审(verdict 需机械与 LLM 双过)
  review_llm_model: deepseek-v4-pro  # LLM 语义审模型
  storm_threshold: 3           # 连续 verify 失败 N 次冻结(chain_frozen)升级人工
  overlap_minutes: 40          # 同仓 diff_scope 重叠自动错开不少于 N 分钟
  dry_run: false               # 全局 dry-run(只计算不写盘;env FLOW_CHAIN_DRY_RUN=1 可覆盖)
  max_depth: 8                 # 链递归深度上限(防风暴/防意外环)
  notify: null                 # 推送命令模板;非空时把通知 JSON 走 stdin 喂给该命令
  warn_hours: 24               # 【W-B 消费】升级提醒阈值(本方案仅声明不消费)
  force_hours: 48              # 【W-B 消费】强制收口阈值(本方案仅声明不消费)
  scan_projects: null          # 【W-C 消费】扫描项目 glob(本方案仅声明不消费)

# models 段(local-executor 新增):模型注册表,只登记结构,不存真实路径/明文 key;
# 键名 = 注册表名(resolve_model 解析);本地条目 url/path 均为本机约定占位
# (127.0.0.1 / ~/.cache/...),真实地址由 user config 覆盖;红线:零个人标识。
budget:                        # cost-weekly-report + cost-budget-guard 新增(全标量,零个人标识)
  exchange_rate: 7.2           # USD→CNY 唯一真相源:周报 env COST_EXCHANGE_RATE;guard env FLOW_BUDGET_EXCHANGE_RATE
  week_start_dow: 0            # 周起始星期(0=周一,Python weekday 口径);env COST_WEEK_START_DOW(仅周报消费)
  week_timezone: Asia/Shanghai # 周界时区;env COST_WEEK_TZ(仅周报消费)
  month_cny: 600               # 月预算上限 CNY;0/缺失/非法=该周期不启用(仅 budget-guard 消费)
  week_cny: 0                  # 周预算上限 CNY;0/缺失/非法=该周期不启用(仅 budget-guard 消费)
  alert_cooldown_h: 24         # 超限告警冷却(小时);缺失/非法回退 24(仅 budget-guard 消费)
  pause_long_task_s: 600       # 超限后暂停的长任务阈值(秒);缺失/非法回退 600(仅 budget-guard 消费)

models:                        # 模型注册表
  qwen35-9b:                   # 本地 LLM 主力(GPU,52 tok/s)
    type: llm
    endpoint: local
    url: "http://127.0.0.1:11434"   # ollama API 基址
    model: "qwen3.5:9b"             # ollama 模型名
    think: true                      # 默认开思考;任务书 think: false 可关(翻译/机械任务)
    speed: 52                        # 参考吞吐(tok/s,仅登记)
    cost: 0                          # 本地零边际成本
    note: "本地 LLM(GPU,52 tok/s),思考可关"
  qwen3-8b:                    # 本地 LLM 备选
    type: llm
    endpoint: local
    url: "http://127.0.0.1:11434"
    model: "qwen3:8b"
    think: true
    cost: 0
    note: "本地 LLM 备选"
  deepseek-flash:              # 云 LLM(与 SIZE_DEFAULTS 的 deepseek-v4-flash 同源,注册表登记用)
    type: llm
    endpoint: api
    provider: deepseek
    model: "deepseek-v4-flash"
    cost: low
    note: "云 LLM"
  deepseek-pro:                # 云 LLM(复杂任务)
    type: llm
    endpoint: api
    provider: deepseek
    model: "deepseek-v4-pro"
    cost: high
    note: "云 LLM(复杂任务)"
  wan21-1.3b:                  # 视频生成(SceneCraft 管线)
    type: video
    endpoint: local
    path: "~/.cache/models/wan21-t2v-1.3b"   # 占位路径;真实路径待 user config 覆盖
    cost: 0
    note: "视频生成(SceneCraft 管线);路径待 user config"
  ltx-2b:                      # 视频生成备选
    type: video
    endpoint: local
    path: "~/.cache/models/ltx-video"        # 占位路径;真实路径待 user config 覆盖
    cost: 0
    note: "视频生成备选;路径待 user config"
  bge-m3:                      # 向量检索
    type: embedding
    endpoint: local
    url: "http://127.0.0.1:9997"
    model: "bge-m3"
    cost: 0
    note: "向量检索"
  bge-reranker:                # 重排
    type: rerank
    endpoint: local
    url: "http://127.0.0.1:9997"
    model: "bge-reranker-v2-m3"
    cost: 0
    note: "重排"


