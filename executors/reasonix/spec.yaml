# executors/reasonix/spec.yaml —— 默认执行器契约(受限 YAML:映射 + list-of-mapping + 标量)
#
# 被 flow-core.py 的 parse_yaml 解析(§P3 §3.1);禁用流式集合/锚点。
# runtime.os 为能力声明(reasonix Linux-only,P4 执行面 preflight 复用);
# invoke.sandbox 对 executor 必须 workspace-write(read-only 非法)。
id: reasonix
version: "1.0.0"
runtime:
  os: linux
  shell: bash
capabilities:
  execute: true
  plan: false
  cost_report: true
invoke:
  binary: rx
  args_template: run -y "TASKBOOK_CONTENT"
  timeout_s: 1800
  sandbox: workspace-write
  # wrapper 超时韧性 env 契约(wrapper.sh 内部读取,flow-core 只透传 --timeout/--model):
  #   RX_TIMEOUT            单超时源:跟随外层 --timeout N(rx 内层不再用 600s 默认值)。
  #                         前提: rx 尊重该值且超时返回 124,partial-complete 判定才成立
  #   RX_WRAPPER_GRACE_S    外层 guard 秒数,默认 30,clamp [1,50](N+GRACE 只防 rx 包装挂起)
  #   RX_MODEL_DEFAULT      默认模型,deepseek-v4-flash
  #   RX_MODEL_PRO          pro 模型,deepseek-v4-pro(rx 经 --pro 标志命中)
  #   RX_MODEL_PRO_THRESHOLD_BYTES  任务书字节阈值 fallback(>= 切 pro),默认 16000;显式声明优先:taskbook ```flow 前置块或正文首部 model: pro|flash 覆盖阈值
  #   RX_BIN                执行面 rx 路径/可注入 stub(测试零 API,同 DSH_BIN 模式)
input:
  taskbook: file
  workdir: dir
output:
  # 契约产物统一由 wrapper 生成到 workitem 的 executor/ 目录;执行者不得在项目根/工作区生成,详见 templates/任务书.md【红线】执行器契约红线
  result_manifest: result.json
  diff: diff.patch
  cost: cost.json
exit_codes:
  ok: 0
  failed: 1
  timeout: 124          # 内层 rx 超时(reasonix 任务超 N,timeout_source=rx)
  timeout_wrapper: 125  # 外层 guard(rx 包装自身挂起,timeout_source=wrapper)
model:
  default: deepseek-v4-flash
  pro: deepseek-v4-pro
  pro_threshold_bytes: 16000
